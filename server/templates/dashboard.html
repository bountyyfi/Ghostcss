<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostCSS - Exfiltration Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.min.js"></script>
</head>
<body class="dashboard">

<header class="dashboard-header">
    <h1>&gt; GhostCSS Exfiltration Dashboard</h1>
    <div style="display: flex; align-items: center; gap: 16px;">
        <span class="status"><span class="dot"></span>Listening</span>
        <button class="btn-clear" onclick="clearEvents()">Clear Log</button>
    </div>
</header>

<div class="dashboard-stats">
    <div class="stat-box">
        <div class="label">Total Events</div>
        <div class="value" id="stat-total">0</div>
    </div>
    <div class="stat-box">
        <div class="label">Unique Sources</div>
        <div class="value" id="stat-sources">0</div>
    </div>
    <div class="stat-box">
        <div class="label">Last Event</div>
        <div class="value" id="stat-last" style="font-size: 1em;">--</div>
    </div>
</div>

<div class="dashboard-events" id="events-container">
    <div class="no-events" id="no-events">
        Waiting for exfiltration events...<br>
        <span style="font-size: 0.8em; color: #222;">
            Point an AI browser agent at a demo page and ask it to summarize the content.
        </span>
    </div>
</div>

<script>
    const socket = io();
    const eventsContainer = document.getElementById('events-container');
    const noEvents = document.getElementById('no-events');
    const statTotal = document.getElementById('stat-total');
    const statSources = document.getElementById('stat-sources');
    const statLast = document.getElementById('stat-last');

    let eventCount = 0;
    const sources = new Set();

    function addEvent(event) {
        // Hide the "no events" message
        noEvents.style.display = 'none';

        // Update stats
        eventCount++;
        sources.add(event.source);
        statTotal.textContent = eventCount;
        statSources.textContent = sources.size;

        const time = new Date(event.timestamp);
        statLast.textContent = time.toLocaleTimeString();

        // Create event entry
        const entry = document.createElement('div');
        entry.className = 'event-entry';
        entry.innerHTML = `
            <div>
                <span class="event-time">${time.toLocaleTimeString()}</span>
                <span class="event-source">[${escapeHtml(event.source)}]</span>
                <span class="event-data">${escapeHtml(event.data)}</span>
            </div>
            <div class="event-meta">
                IP: ${escapeHtml(event.ip)} |
                UA: ${escapeHtml(truncate(event.user_agent, 80))} |
                Ref: ${escapeHtml(event.referer || 'none')}
                ${event.metadata && Object.keys(event.metadata).length > 0
                    ? ' | Meta: ' + escapeHtml(JSON.stringify(event.metadata))
                    : ''}
            </div>
        `;

        // Insert at top (newest first)
        eventsContainer.insertBefore(entry, eventsContainer.firstChild);
    }

    function clearEvents() {
        fetch('/api/events/clear', { method: 'POST' })
            .then(() => {
                eventsContainer.innerHTML = '';
                eventsContainer.appendChild(noEvents);
                noEvents.style.display = 'block';
                eventCount = 0;
                sources.clear();
                statTotal.textContent = '0';
                statSources.textContent = '0';
                statLast.textContent = '--';
            });
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function truncate(str, len) {
        return str && str.length > len ? str.substring(0, len) + '...' : str || '';
    }

    // WebSocket event handlers
    socket.on('new_event', function(event) {
        addEvent(event);
    });

    socket.on('events_cleared', function() {
        eventsContainer.innerHTML = '';
        eventsContainer.appendChild(noEvents);
        noEvents.style.display = 'block';
        eventCount = 0;
        sources.clear();
        statTotal.textContent = '0';
        statSources.textContent = '0';
        statLast.textContent = '--';
    });

    // Load existing events on page load
    fetch('/api/events')
        .then(r => r.json())
        .then(data => {
            if (data.events && data.events.length > 0) {
                data.events.forEach(addEvent);
            }
        });
</script>

</body>
</html>
